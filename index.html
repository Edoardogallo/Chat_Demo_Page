<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #d32f2f; color: #fff; cursor: pointer; }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 8px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<button id="rec">● Start recording</button>
<div id="status"></div>

<script>
const WEBHOOK = 'https://studio-live.us-1.smile.cx/webhook/tab-recording';
const btn = document.getElementById('rec');
const status = document.getElementById('status');
const cid = new URLSearchParams(location.search).get('cid') || 'unknown';
let rec, session, index, queue;

if (document.featurePolicy && !document.featurePolicy.allowsFeature('display-capture')) {
  btn.disabled = true;
  status.textContent = 'display-capture not allowed on this iframe';
}

function upload(blob) {
  const i = index++;
  queue = queue
    .then(() => fetch(`${WEBHOOK}?cid=${encodeURIComponent(cid)}&session=${session}&i=${i}`, {
      method: 'POST',
      body: blob,
    }))
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); })
    .catch(err => { status.textContent = `Chunk ${i} failed: ${err.message}`; });
}

btn.onclick = async () => {
  if (rec?.state === 'recording') return rec.stop();
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: { displaySurface: 'browser' },
      audio: true,
      preferCurrentTab: true,
      selfBrowserSurface: 'include',
    });

    session = `${cid}_${Date.now()}`;
    index = 0;
    queue = Promise.resolve();

    rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    rec.ondataavailable = e => e.data.size && upload(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      btn.textContent = '● Start recording';
      status.textContent = 'Finishing upload...';
      await queue;
      if (!status.textContent.includes('failed')) status.textContent = `Saved as ${session}.webm`;
    };
    stream.getVideoTracks()[0].onended = () => rec.state === 'recording' && rec.stop();

    rec.start(5000);
    btn.textContent = '■ Stop recording';
    status.textContent = 'Recording...';
  } catch (err) {
    status.textContent = `${err.name}: ${err.message}`;
    console.error(err);
  }
};
</script>
</body>
</html>
